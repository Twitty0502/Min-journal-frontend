<div class="login">

    <h1>My Journal</h1>
    <h2>Login:</h2>
    <label for="username">Username</label>

    <input id="username" type="text" [(ngModel)]="username" placeholder="Username">

    <label for="password">Password</label>
    <input id="password" type="password" [(ngModel)]="password" placeholder="Password">

    <button (click)="login()">Login</button>

    <button (click)="register()">Create account</button>

    <p *ngIf="errorMessage"> {{ errorMessage }}</p>
</div>
